name: Verify & Deploy Portfolio 3D Reborn to GitHub Pages

on:
  push:
    branches: ["main", "fix/**", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies reproducibly from lockfile
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest unit, data & graph verification suite
        run: npm run test

      - name: Install Playwright Chromium for E2E verification
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E test suite
        run: npm run test:e2e

      - name: "Build Next.js Static Export"
        run: npm run build

      - name: Ensure .nojekyll and verify SEO artifacts in ./out
        run: |
          touch ./out/.nojekyll
          test -f ./out/index.html
          test -f ./out/work/index.html
          test -f ./out/lab/index.html
          test -f ./out/sitemap.xml
          test -f ./out/robots.txt

      - name: Upload Pages artifact (main branch only)
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
